services:
 
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: musicuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-musicpass}
      POSTGRES_DB: musicdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musicuser -d musicdb"]
      interval: 5s
      timeout: 5s
      retries: 10
 
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: postgresql://musicuser:${POSTGRES_PASSWORD:-musicpass}@postgres:5432/musicdb
      MUSIC_DIR: /music
      COVERS_DIR: /covers
      BASE_URL: http://localhost:5000
      FRONTEND_URL: http://localhost:3000
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
      LASTFM_SHARED_SECRET: ${LASTFM_SHARED_SECRET:-}
      FLASK_DEBUG: 'false'
    volumes:
      - ${MUSIC_DIR:-./music}:/music:ro
      - covers_data:/covers
    depends_on:
      postgres:
        condition: service_healthy
 
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
 
volumes:
  postgres_data:
  covers_data: