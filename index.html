<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="assest/favicon.png">
    <title>Music Player</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<div class="app">

  <aside class="side-bar">

    <!-- Profile section -->
    <div class="profile-section">
      <div id="logged-out-view">
        <button id="btn-login" class="profile-btn">
          <i class="fa-solid fa-user"></i> Login
        </button>
      </div>

      <div id="logged-in-view" hidden>
        <button id="profile-toggle" class="profile-info">
          <i class="fa-solid fa-circle-user"></i>
          <span id="profile-username">Username</span>
          <i class="fa-solid fa-chevron-down" id="profile-chevron"></i>
        </button>
        <div id="profile-dropdown" class="profile-dropdown" hidden>
          <button id="btn-lastfm" class="lastfm-btn">
            <i class="fa-brands fa-lastfm"></i>
            <span id="lastfm-status">Connect Last.fm</span>
          </button>
          <button id="btn-scan" class="scan-btn">
            <i class="fa-solid fa-arrows-rotate"></i> Scan Library
          </button>
          <button id="btn-logout" class="logout-btn">
            <i class="fa-solid fa-right-from-bracket"></i> Logout
          </button>
        </div>
      </div>
    </div>

    <!-- Library nav -->
    <div class="sidebar-section">
      <h3 class="sidebar-heading">Library</h3>
      <ul class="sidebar-nav">
        <li class="nav-item active" data-view="songs">
          <i class="fa-solid fa-music"></i> Songs
        </li>
        <li class="nav-item" data-view="artists">
          <i class="fa-solid fa-microphone"></i> Artists
        </li>
        <li class="nav-item" data-view="albums">
          <i class="fa-solid fa-record-vinyl"></i> Albums
        </li>
        <li class="nav-item" data-view="favourites">
          <i class="fa-solid fa-heart"></i> Favourites
        </li>
      </ul>
    </div>

    <!-- Playlists -->
    <div class="sidebar-section">
      <div class="sidebar-heading-row">
        <h3 class="sidebar-heading">Playlist</h3>
        <button id="btn-new-playlist">
          <i class="fa-solid fa-plus"></i>
        </button>
      </div>
      <ul class="sidebar-nav" id="playlist-list"></ul>
    </div>

  </aside>

  <main class="main-content">

    <div class="track-section">

      <div class="view" id="view-songs">
        <div class="view-header">
          <img class="view-cover" src="" alt="Cover" />
          <div>
            <p class="view-label">Songs</p>
            <h1 class="view-title" id="view-title">Songs</h1>
            <p class="view-meta" id="view-meta">9 songs · 32 min</p>
          </div>
        </div>
        <table class="track-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Title</th>
              <th>Artist</th>
              <th><i class="fa-regular fa-clock"></i></th>
            </tr>
          </thead>
          <tbody id="track-list-body"></tbody>
        </table>
      </div>

      <div class="view" id="view-artists" hidden>
        <div class="view-header">
          <div>
            <p class="view-label">Artists</p>
            <h1 class="view-title">All Artists</h1>
          </div>
        </div>
        <table class="track-table">
          <thead>
            <tr>
              <th>Artist</th>
              <th>Songs</th>
            </tr>
          </thead>
          <tbody id="artist-list-body"></tbody>
        </table>
      </div>

      <div class="view" id="view-albums" hidden>
        <div class="view-header">
          <div>
            <p class="view-label">Albums</p>
            <h1 class="view-title">All Albums</h1>
          </div>
        </div>
        <table class="track-table">
          <thead>
            <tr>
              <th>Album</th>
              <th>Artist</th>
              <th>Songs</th>
            </tr>
          </thead>
          <tbody id="album-list-body"></tbody>
        </table>
      </div>

      <div class="view" id="view-favourites" hidden>
      </div>

    </div>

    <section class="now-playing">
      <img id="np-cover" class="np-cover" src="Assest/CoverImage/album-placeholder.png" alt="" />
      <div class="np-info">
        <h2 id="np-title">Track Title</h2>
        <p id="np-artist">Artist</p>
      </div>
      <div class="progress-bar">
        <span id="current-time">0:00</span>
        <input type="range" id="progress-bar" value="0" min="0" max="100" />
        <span id="song-duration">0:00</span>
      </div>
      <div class="np-controls">
        <button class="ctrl-btn" id="btn-shuffle">
          <i class="fa-solid fa-shuffle"></i>
        </button>
        <button class="ctrl-btn" id="prev-btn">
          <i class="fa-solid fa-backward-step"></i>
        </button>
        <button class="ctrl-btn play-btn">
          <i class="fa-solid fa-play" id="play-icon"></i>
        </button>
        <button class="ctrl-btn" id="next-btn">
          <i class="fa-solid fa-forward-step"></i>
        </button>
        <button class="ctrl-btn" id="repeat-btn">
          <i class="fa-solid fa-repeat"></i>
          <span id="repeat-badge">1</span>
        </button>
      </div>
      <div class="np-volume">
        <button class="ctrl-btn" id="mute-btn">
          <i class="fa-solid fa-volume-high" id="vol-icon"></i>
        </button>
        <input type="range" id="volume" value="80" min="0" max="100" />
      </div>
    </section>

  </main>

  <audio id="audio-player"></audio>

</div>

<!-- Auth Modal -->
<div id="auth-modal" class="modal-overlay" hidden>
  <div class="modal-box">
    <button id="close-modal" class="modal-close">&times;</button>
    <div class="modal-tabs">
      <button class="tab-btn active" data-tab="login">Login</button>
      <button class="tab-btn" data-tab="register">Register</button>
    </div>
    <div id="login-tab" class="tab-content">
      <input type="text" id="login-username" placeholder="Username" />
      <input type="password" id="login-password" placeholder="Password" />
      <button id="submit-login" class="modal-submit">Login</button>
      <p id="login-error" class="modal-error"></p>
    </div>
    <div id="register-tab" class="tab-content" hidden>
      <input type="text" id="register-username" placeholder="Username" />
      <input type="email" id="register-email" placeholder="Email" />
      <input type="password" id="register-password" placeholder="Password" />
      <button id="submit-register" class="modal-submit">Create Account</button>
      <p id="register-error" class="modal-error"></p>
    </div>
  </div>
</div>

<script type="module" src="js/main.js"></script>

</body>
</html>
